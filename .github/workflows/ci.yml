# Continuous integration on GitHub's hosted runners. It holds no AWS credentials at all: the synth below runs without
# any, and deploying is the job of the pipeline in the AWS account (infra/lib/pipeline-stack.ts), which pulls master.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# A newer push to a pull request makes the older run pointless. Runs on master all finish: each scans only the lines
# its own push added, so a cancelled one would leave a merge unscanned.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Check, test and synth
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm -w web run build:open-next
      # The same synth the pipeline runs, with stand-ins for the two account values, so the AwsSolutions checks gate
      # every pull request. Without credentials the account stays a CloudFormation token, which the checks accept.
      - name: cdk synth (stage aws, no credentials)
        working-directory: infra
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          CDK_DISABLE_CLI_TELEMETRY: "true"
        run: >-
          npx cdk synth -c stage=aws -c alertEmail=ops@example.com
          -c certificateArn=arn:aws:acm:us-east-1:123456789012:certificate/00000000-0000-0000-0000-000000000000
          --strict --no-notices -q

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The pre-push hook's scan, which a push with --no-verify skips, over what this pull request or push adds.
      - name: Scan the added lines
        # bash here means pipefail too, so a failed diff fails the step instead of scanning nothing.
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        # A push that created the branch, or a force-push, has no previous commit here; it scans its last commit.
        run: |
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=HEAD~1
          git diff --no-color --no-ext-diff -U0 "$BASE...HEAD" | sh .githooks/scan-diff
